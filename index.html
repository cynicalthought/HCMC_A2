<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
    <title>Quiz Interface - Deriv Market Questions</title>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-panel: rgba(15, 23, 42, 0.88);
            --bg-panel-solid: #0f172a;
            --border: rgba(56, 189, 248, 0.22);
            --border-strong: rgba(56, 189, 248, 0.5);
            --accent: #38bdf8;
            --accent-dim: #0ea5e9;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-soft: #64748b;
            --correct: #34d399;
            --correct-bg: rgba(52, 211, 153, 0.12);
            --wrong: #f87171;
            --wrong-bg: rgba(248, 113, 113, 0.12);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --shadow-panel: 0 0 0 1px var(--border), 0 8px 28px rgba(0, 0, 0, 0.32);
            --nav-size: 72px;
        }

        html {
            -webkit-text-size-adjust: 100%;
            box-sizing: border-box;
        }
        *, *::before, *::after { box-sizing: inherit; }

        body {
            margin: 0;
            padding: 20px 16px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(14, 165, 233, 0.1) 0%, transparent 55%);
            color: var(--text);
            font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
            gap: 6px;
        }

        .page-header {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.02em;
            margin: 0;
        }

        .counters-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .question-counter {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }

        .score-board {
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-align: center;
            margin-top: 18px;
            width: auto;
            max-width: 100%;
            padding: 11px 22px;
            border-radius: var(--radius-md);
            background: var(--bg-panel);
            color: var(--text-muted);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-panel);
            font-variant-numeric: tabular-nums;
        }
        .score-board .score-pct { color: var(--accent); font-weight: 600; }
        .score-board .score-ok { color: var(--correct); }
        .score-board .score-bad { color: var(--wrong); }

        .quiz-container {
            width: 95%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .question-panel {
            width: 100%;
            min-height: 110px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-panel);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 22px 26px;
            margin-bottom: 18px;
        }

        .question-text {
            font-size: 1.08rem;
            line-height: 1.5;
            font-weight: 500;
            text-align: center;
            color: var(--text);
        }

        .options-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 14px;
        }

        .option-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text);
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
            display: flex;
            align-items: flex-start;
            outline: none;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.07);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }
        .option-btn:disabled { cursor: default; }

        .option-label {
            font-weight: 600;
            color: var(--accent);
            margin-right: 10px;
            min-width: 18px;
            flex-shrink: 0;
        }
        .option-content {
            flex-grow: 1;
            line-height: 1.4;
        }

        .option-btn.correct {
            background: var(--correct-bg);
            border-color: var(--correct);
        }
        .option-btn.correct .option-label,
        .option-btn.correct .option-content { color: var(--correct); }

        .option-btn.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong);
        }
        .option-btn.wrong .option-label,
        .option-btn.wrong .option-content { color: var(--wrong); }

        .explanation-box {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 13px 15px;
            background: var(--wrong-bg);
            border: 1px solid rgba(248, 113, 113, 0.32);
            border-radius: var(--radius-md);
            color: #fecaca;
            font-size: 0.88rem;
            line-height: 1.5;
            text-align: left;
        }
        .explanation-box.visible { display: block; }

        .footer-controls {
            margin-top: 16px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        .action-btn {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: var(--radius-sm);
            padding: 11px 22px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.28);
            transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.12s ease;
        }
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(14, 165, 233, 0.4);
            filter: brightness(1.04);
        }
        #nextBtn { display: none; }

        /* ===== Navigation dock — unified tiles ===== */
        .navigation-dock {
            margin-top: 24px;
            width: 100%;
            max-width: 920px;
            padding-top: 16px;
            border-top: 1px solid rgba(56, 189, 248, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .nav-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin: 0;
        }

        .nav-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr) auto;
            grid-template-rows: auto auto;
            gap: 10px;
            width: 100%;
            max-width: 780px;
            justify-items: stretch;
            align-items: stretch;
        }

        /* Category tiles — professional typography & alignment */
        .nav-tile {
            min-width: 0;
            height: 56px;
            padding: 6px 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease, color 0.18s ease;
            position: relative;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            text-align: center;
            line-height: 1.25;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
            hyphens: auto;
            -webkit-hyphens: auto;
        }

        .nav-tile:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--border-strong);
            transform: translateY(-1px);
            color: var(--accent);
        }

        .nav-tile.active {
            background: rgba(56, 189, 248, 0.14);
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.18);
            color: var(--accent);
            font-weight: 600;
        }

        /* Random quiz spans both rows */
        .nav-tile.has-icon {
            grid-column: 5;
            grid-row: 1 / span 2;
            width: var(--nav-size);
            min-width: var(--nav-size);
            height: auto;
            min-height: 122px; /* 2 × 56 + gap */
            padding: 8px;
            align-self: stretch;
        }
        .nav-tile.has-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
            display: block;
        }

        /* Shuffle button */
        .shuffle-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
            margin-left: 10px;
        }
        .shuffle-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--border-strong);
            color: var(--accent);
            transform: translateY(-1px);
        }
        .shuffle-btn:active,
        .shuffle-btn.pressed {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
            transform: translateY(0);
        }

        /* Tooltip */
        .nav-tile[data-title]::after {
            content: attr(data-title);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel-solid);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: none;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 50;
        }
        .nav-tile[data-title]:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-2px);
        }

        .completion-screen {
            display: none;
            text-align: center;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-panel);
            width: 100%;
        }
        .completion-screen h2 {
            font-size: 1.35rem;
            color: var(--accent);
            margin: 0 0 14px;
            font-weight: 600;
        }
        #finalScoreText {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* ===== Mobile ===== */
        @media (max-width: 480px) {
            body {
                padding: 12px 10px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                justify-content: flex-start;
            }
            .header-container { margin-bottom: 8px; gap: 4px; }
            .page-header { font-size: 0.98rem; }
            .question-counter { font-size: 0.78rem; }
            .quiz-container {
                width: 100%;
                flex-grow: 0;
                justify-content: flex-start;
            }
            .question-panel {
                min-height: auto;
                padding: 14px;
                margin-bottom: 12px;
            }
            .question-text { font-size: 0.96rem; line-height: 1.4; }
            #questionImage { max-height: 180px; object-fit: contain; }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .option-btn {
                padding: 13px 14px;
                font-size: 0.88rem;
                min-height: 50px;
                align-items: center;
            }
            .explanation-box {
                margin-top: 10px;
                padding: 11px 12px;
                font-size: 0.85rem;
            }
            .score-board {
                font-size: 0.78rem;
                padding: 10px 12px;
                margin-top: 12px;
                width: 100%;
            }
            .footer-controls {
                margin-top: 12px;
                justify-content: center;
            }
            .action-btn {
                padding: 12px 28px;
                min-height: 46px;
                width: 100%;
                max-width: 280px;
            }

            .navigation-dock {
                margin-top: 14px;
                padding-top: 12px;
                gap: 8px;
            }
            .nav-label { font-size: 0.65rem; }

            .nav-row {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
                grid-template-rows: auto auto;
                gap: 6px;
                max-width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 4px;
                scrollbar-width: none;
            }
            .nav-row::-webkit-scrollbar { display: none; }

            :root { --nav-size: 56px; }

            .nav-tile {
                min-width: 0;
                height: 52px;
                font-size: 0.58rem;
                font-weight: 500;
                letter-spacing: 0.01em;
                line-height: 1.2;
                padding: 4px 5px;
                word-break: break-word;
                overflow-wrap: anywhere;
            }
            .nav-tile.has-icon {
                grid-column: 5;
                grid-row: 1 / span 2;
                width: var(--nav-size);
                min-width: var(--nav-size);
                height: auto;
                min-height: 110px;
                padding: 5px;
            }

            .nav-tile[data-title]::after { display: none; }

            .shuffle-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
                margin-left: 6px;
            }

            .completion-screen { padding: 26px 16px; }
            .completion-screen h2 { font-size: 1.2rem; }
            #finalScoreText { font-size: 0.92rem !important; }
        }

        /* iPhone 12 Pro / similar (~390px) fine-tuning */
        @media (max-width: 430px) {
            .nav-tile {
                font-size: 0.55rem;
                padding: 3px 4px;
                height: 50px;
                line-height: 1.18;
                letter-spacing: 0;
            }
            .nav-row {
                gap: 5px;
            }
        }

        @media (max-width: 360px) {
            :root { --nav-size: 50px; }
            .page-header { font-size: 0.9rem; }
            .question-text { font-size: 0.9rem; }
            .score-board { font-size: 0.72rem; }
            .nav-tile {
                height: 46px;
                font-size: 0.52rem;
                padding: 3px 3px;
                line-height: 1.15;
            }
        }

        @media (pointer: coarse) {
            .option-btn { min-height: 50px; }
            .action-btn { min-height: 46px; }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <div class="header-container">
            <div class="page-header" id="pageTitle">Φόρτωση...</div>
            <div class="counters-wrapper">
                <div class="question-counter" id="questionCounter">Ερώτηση: 0 / 0</div>
                <button class="shuffle-btn" id="shuffleBtn" onclick="shuffleCurrentModule()" title="Shuffle questions">
                    🔀 Shuffle
                </button>
            </div>
        </div>

        <div class="question-panel">
            <div class="question-text" id="questionText">Φόρτωση ερωτήσεων...</div>
            <div id="imageContainer" style="margin-top: 14px; text-align: center; display: none;">
                <img id="questionImage" src="" alt="Question Graph" style="max-width: 100%; height: auto; border-radius: 8px;" />
            </div>
        </div>

        <div class="options-grid" id="optionsGrid">
            <button class="option-btn" onclick="checkAnswer('α', event)">
                <span class="option-label">Α:</span>
                <span class="option-content" id="opt-alpha">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('β', event)">
                <span class="option-label">Β:</span>
                <span class="option-content" id="opt-beta">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('γ', event)">
                <span class="option-label">Γ:</span>
                <span class="option-content" id="opt-gamma">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('δ', event)">
                <span class="option-label">Δ:</span>
                <span class="option-content" id="opt-delta">...</span>
            </button>
        </div>

        <div class="explanation-box" id="explanationBox"></div>

        <div class="score-board" id="scoreBoard">
            Επιτυχία: <span class="score-pct">0%</span>
            &nbsp;·&nbsp;
            <span class="score-ok">✅ 0</span>
            &nbsp;/&nbsp;
            <span class="score-bad">❌ 0</span>
        </div>

        <div class="footer-controls">
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Επόμενη</button>
        </div>
    </div>

    <div class="quiz-container">
        <div class="completion-screen" id="completionScreen">
            <h2 id="completionTitle">Το Κουίζ Ολοκληρώθηκε!</h2>
            <p id="finalScoreText"></p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="action-btn" onclick="restartQuiz()">Επανεκκίνηση</button>
            </div>
        </div>
    </div>

    <div class="navigation-dock">
        <p class="nav-label">Ενότητες</p>
        <div class="nav-row" id="categoriesGrid"></div>
    </div>

    <!-- External Question Files -->
    <script src="1_paragoga_xrimatopistotika_mesa.js"></script>
    <script src="2_agora_paragogon.js"></script>
    <script src="3_arbitrage.js"></script>
    <script src="4_prothesmiaka_symvolaia_kai_sme.js"></script>
    <script src="5_dikaiomata_proairesis.js"></script>
    <script src="6_swaps.js"></script>
    <script src="7_anoiktes_poliseis.js"></script>
    <script src="8_warrants.js"></script>

    <script>
        window.module1Data = window.module1Data || { title: "Παράγωγα Χρηματοπιστωτικά Μέσα", data: [] };
        window.module2Data = window.module2Data || { title: "Αγορά Παραγώγων", data: [] };
        window.module3Data = window.module3Data || { title: "Arbitrage", data: [] };
        window.module4Data = window.module4Data || { title: "Προθεσμιακά Συμβόλαια & ΣΜΕ", data: [] };
        window.module5Data = window.module5Data || { title: "Δικαιώματα Προαίρεσης", data: [] };
        window.module6Data = window.module6Data || { title: "Swaps", data: [] };
        window.module7Data = window.module7Data || { title: "Ανοιχτές Πωλήσεις", data: [] };
        window.module8Data = window.module8Data || { title: "Warrants", data: [] };

        const modules = {
            derivatives: module1Data,
            market: module2Data,
            arbitrage: module3Data,
            futures: module4Data,
            options: module5Data,
            swaps: module6Data,
            shortselling: module7Data,
            warrants: module8Data
        };

        function generateRandomQuizPool() {
            let combinedQuestions = [];
            Object.keys(modules).forEach(key => {
                const mod = modules[key];
                if (mod && mod.data && mod.data.length > 0) {
                    let targetCount = Math.round(mod.data.length * 0.0625);
                    if (targetCount < 1) targetCount = 1;
                    let shuffled = [...mod.data].sort(() => 0.5 - Math.random());
                    combinedQuestions = combinedQuestions.concat(shuffled.slice(0, targetCount));
                }
            });
            return combinedQuestions.sort(() => 0.5 - Math.random());
        }

        const randomQuizData = {
            title: "Random Quiz",
            data: generateRandomQuizPool()
        };

        const categoryModules = {
            derivatives: { ...module1Data },
            market: { ...module2Data },
            arbitrage: { ...module3Data },
            futures: { ...module4Data },
            options: { ...module5Data },
            swaps: { ...module6Data },
            shortselling: { ...module7Data },
            warrants: { ...module8Data }
        };

        const allQuizCategories = {
            ...categoryModules,
            randomQuiz: randomQuizData
        };

        const moduleStates = {
            randomQuiz: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            derivatives: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            market: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            arbitrage: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            futures: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            options: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            swaps: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            shortselling: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            warrants: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false }
        };

        let currentModuleKey = 'randomQuiz';

        function loadModule(moduleKey) {
            currentModuleKey = moduleKey;
            updateNavActiveState();
            const state = moduleStates[currentModuleKey];
            if (state.isCompleted) {
                showCompletionScreen();
            } else {
                document.getElementById('completionScreen').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'flex';
                displayQuestion();
            }
        }

        function updateNavActiveState() {
            document.querySelectorAll('.nav-tile').forEach(btn => {
                if (btn.getAttribute('data-module') === currentModuleKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function normalizeRomanAnswer(text) {
            if (!text) return text;
            const trimmed = text.trim().replace(/\.$/, '');
            const romanListRegex = /^([ΙIVivΧX]+(?:\s*[,+&]\s*[ΙIVivΧX]+)+(?:\s*(?:και|&)\s*[ΙIVivΧX]+)?)$/i;
            const endsWithList = /([ΙIVivΧX]+(?:\s*[,+&]\s*[ΙIVivΧX]+)+(?:\s*(?:και|&)\s*[ΙIVivΧX]+)?)$/i;
            let listPart = null;
            let prefix = '';
            if (romanListRegex.test(trimmed)) {
                listPart = trimmed;
            } else {
                const m = trimmed.match(endsWithList);
                if (m) {
                    listPart = m[1];
                    prefix = trimmed.slice(0, m.index).trim();
                }
            }
            if (!listPart) return text;
            return (prefix ? prefix + ' ' : '') + formatRomanList(listPart);
        }

        function formatRomanList(str) {
            let parts = str
                .replace(/\s*&\s*/g, ',')
                .replace(/\s*και\s*/gi, ',')
                .replace(/\s*\+\s*/g, ',')
                .split(',')
                .map(p => p.trim())
                .filter(Boolean);
            if (parts.length === 0) return str;
            if (parts.length === 1) return parts[0];
            if (parts.length === 2) return `${parts[0]} και ${parts[1]}`;
            return parts.slice(0, -1).join(', ') + ' και ' + parts[parts.length - 1];
        }

        function displayQuestion() {
            const currentModule = allQuizCategories[currentModuleKey];
            const state = moduleStates[currentModuleKey];

            if (!currentModule || !currentModule.data || currentModule.data.length === 0) {
                document.getElementById('pageTitle').innerText = currentModule ? currentModule.title : "Σφάλμα";
                document.getElementById('questionCounter').innerText = "Ερώτηση: 0 / 0";
                document.getElementById('questionText').innerText = "Δεν βρέθηκαν ερωτήσεις σε αυτό το αρχείο ή τα αρχεία JS δεν φορτώθηκαν σωστά.";
                document.getElementById('imageContainer').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }

            const qData = currentModule.data[state.currentIndex];

            document.getElementById('pageTitle').innerText = currentModule.title;
            document.getElementById('questionCounter').innerText = `Ερώτηση: ${state.currentIndex + 1} / ${currentModule.data.length}`;
            document.getElementById('questionText').innerText = qData.question.replace(/^\d+[\.\)]\s*/, '');

            const imageContainer = document.getElementById('imageContainer');
            const questionImage = document.getElementById('questionImage');
            if (qData.image) {
                questionImage.src = qData.image;
                imageContainer.style.display = 'block';
            } else {
                questionImage.src = '';
                imageContainer.style.display = 'none';
            }

            const optionMap = {
                'α': document.getElementById('opt-alpha'),
                'β': document.getElementById('opt-beta'),
                'γ': document.getElementById('opt-gamma'),
                'δ': document.getElementById('opt-delta')
            };
            const optionButtons = document.querySelectorAll('.option-btn');

            optionButtons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
                btn.style.display = '';
            });

            ['α', 'β', 'γ', 'δ'].forEach(key => {
                const text = (qData.options[key] || '').trim();
                const el = optionMap[key];
                const btn = el.closest('.option-btn');
                if (text === 'Null.' || text === 'Null' || text === '') {
                    btn.style.display = 'none';
                } else {
                    el.innerText = normalizeRomanAnswer(text);
                    btn.style.display = '';
                }
            });

            const explanationBox = document.getElementById('explanationBox');
            explanationBox.classList.remove('visible');
            explanationBox.innerHTML = '';

            if (state.answered) {
                optionButtons.forEach(btn => btn.disabled = true);
                const correctOption = qData.correct;
                optionButtons.forEach(btn => {
                    const onclickAttr = btn.getAttribute('onclick');
                    if (onclickAttr && onclickAttr.includes(`'${correctOption}'`)) {
                        btn.classList.add('correct');
                    }
                });
                if (state.selectedAnswer && state.selectedAnswer !== correctOption) {
                    optionButtons.forEach(btn => {
                        const onclickAttr = btn.getAttribute('onclick');
                        if (onclickAttr && onclickAttr.includes(`'${state.selectedAnswer}'`)) {
                            btn.classList.add('wrong');
                        }
                    });
                    if (qData.explanation) {
                        explanationBox.innerHTML = qData.explanation;
                        explanationBox.classList.add('visible');
                    }
                }
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                document.getElementById('nextBtn').style.display = 'none';
            }

            updateScoreBoard();
        }

        function checkAnswer(selectedOption, event) {
            const state = moduleStates[currentModuleKey];
            if (state.answered) return;
            state.answered = true;
            state.selectedAnswer = selectedOption;
            state.totalAnswered++;

            const currentModule = allQuizCategories[currentModuleKey];
            if (!currentModule || !currentModule.data || currentModule.data.length === 0) return;

            const qData = currentModule.data[state.currentIndex];
            const correctOption = qData.correct;
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => btn.disabled = true);

            const explanationBox = document.getElementById('explanationBox');
            explanationBox.classList.remove('visible');
            explanationBox.innerHTML = '';

            if (selectedOption === correctOption) {
                state.totalCorrect++;
                event.currentTarget.classList.add('correct');
            } else {
                event.currentTarget.classList.add('wrong');
                optionButtons.forEach(btn => {
                    const onclickAttr = btn.getAttribute('onclick');
                    if (onclickAttr && onclickAttr.includes(`'${correctOption}'`)) {
                        btn.classList.add('correct');
                    }
                });
                if (qData.explanation) {
                    explanationBox.innerHTML = qData.explanation;
                    explanationBox.classList.add('visible');
                }
            }

            document.getElementById('nextBtn').style.display = 'block';
            updateScoreBoard();
        }

        function updateScoreBoard() {
            const state = moduleStates[currentModuleKey];
            let percentage = 0;
            if (state.totalAnswered > 0) {
                percentage = Math.round((state.totalCorrect / state.totalAnswered) * 100);
            }
            const totalIncorrect = state.totalAnswered - state.totalCorrect;
            document.getElementById('scoreBoard').innerHTML =
                `Επιτυχία: <span class="score-pct">${percentage}%</span>` +
                `&nbsp;·&nbsp;<span class="score-ok">✅ ${state.totalCorrect}</span>` +
                `&nbsp;/&nbsp;<span class="score-bad">❌ ${totalIncorrect}</span>`;
        }

        function nextQuestion() {
            const currentModule = allQuizCategories[currentModuleKey];
            const state = moduleStates[currentModuleKey];
            state.currentIndex++;
            state.answered = false;
            state.selectedAnswer = null;

            if (currentModule && state.currentIndex < currentModule.data.length) {
                displayQuestion();
            } else {
                state.isCompleted = true;
                showCompletionScreen();
            }
        }

        function showCompletionScreen() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('completionScreen').style.display = 'block';
            const state = moduleStates[currentModuleKey];
            let percentage = 0;
            if (state.totalAnswered > 0) {
                percentage = Math.round((state.totalCorrect / state.totalAnswered) * 100);
            }
            const totalIncorrect = state.totalAnswered - state.totalCorrect;
            document.getElementById('finalScoreText').innerText =
                `Ολοκληρώθηκε! Συνολικό Ποσοστό Επιτυχίας: ${percentage}% | ${state.totalCorrect} ✅ / ${totalIncorrect} ❌ (από ${state.totalAnswered} απαντημένες).`;
        }

        function restartQuiz() {
            const state = moduleStates[currentModuleKey];
            state.currentIndex = 0;
            state.totalCorrect = 0;
            state.totalAnswered = 0;
            state.answered = false;
            state.selectedAnswer = null;
            state.isCompleted = false;
            if (currentModuleKey === 'randomQuiz') {
                randomQuizData.data = generateRandomQuizPool();
            }
            loadModule(currentModuleKey);
        }

        function createNavTile(moduleKey, title, iconSrc) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-tile';
            btn.setAttribute('data-module', moduleKey);
            btn.setAttribute('data-title', title);

            if (iconSrc) {
                btn.classList.add('has-icon');
                const img = document.createElement('img');
                img.src = iconSrc;
                img.alt = title;
                btn.appendChild(img);
            } else {
                btn.textContent = title;
            }

            btn.onclick = () => loadModule(moduleKey);
            return btn;
        }

        function initNavDock() {
            const row = document.getElementById('categoriesGrid');
            row.innerHTML = '';

            Object.keys(categoryModules).forEach(key => {
                const mod = categoryModules[key];
                // Text-only tiles for categories (no icons)
                row.appendChild(createNavTile(key, mod.title, null));
            });

            // Random quiz keeps the image
            row.appendChild(createNavTile(
                'randomQuiz',
                'Random Quiz',
                'Artwork/random_quiz.jpeg'
            ));
        }

        function shuffleCurrentModule() {
            const currentModule = allQuizCategories[currentModuleKey];
            if (!currentModule || !currentModule.data || currentModule.data.length === 0) return;

            // Visual feedback – light up briefly
            const btn = document.getElementById('shuffleBtn');
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 350);

            // Fisher-Yates shuffle
            const arr = currentModule.data;
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }

            // Reset progress for this module
            const state = moduleStates[currentModuleKey];
            state.currentIndex = 0;
            state.totalCorrect = 0;
            state.totalAnswered = 0;
            state.answered = false;
            state.selectedAnswer = null;
            state.isCompleted = false;

            // Hide completion screen if visible and show quiz
            document.getElementById('completionScreen').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'flex';

            displayQuestion();
        }

        window.onload = function() {
            initNavDock();
            loadModule('randomQuiz');
        };
    </script>
</body>
</html>
