<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
    <title>Quiz Interface - Deriv Market Questions</title>
    <style>
        :root {
            --bg-color: #020518;
            --panel-bg: rgba(5, 15, 45, 0.75);
            --border-glow: #00d2ff;
            --text-color: #ffffff;
            --correct-color: #00ff66;
            --wrong-color: #ff3333;
        }

        html {
            -webkit-text-size-adjust: 100%;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #0a1b42 0%, var(--bg-color) 80%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .page-header {
            font-size: 1.4rem;
            color: #8ab4f8;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .counters-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
        }

        .question-counter {
            font-size: 1rem;
            color: #00d2ff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .score-board {
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            font-weight: 800;
            text-align: center;
            margin-top: 20px;
            width: auto;
            max-width: 100%;
            padding: 14px 32px;
            border-radius: 50px;
            /* Winner-banner: red marquee frame + yellow lights */
            background: linear-gradient(180deg, #9b0000 0%, #6b0000 45%, #4a0000 100%);
            color: #FFD700;
            text-shadow: 0 1px 0 #b8860b, 0 2px 4px rgba(0,0,0,0.65);
            border: 5px solid #e63900;
            box-shadow:
                0 0 0 3px #ffcc00,
                0 0 14px 3px rgba(255, 200, 0, 0.75),
                0 8px 22px rgba(0,0,0,0.55),
                inset 0 0 22px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Yellow light-bulb dots along top & bottom edges */
        .score-board::before,
        .score-board::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            height: 8px;
            pointer-events: none;
            background-image: radial-gradient(circle, #ffeb3b 0 3.5px, transparent 4px);
            background-size: 15px 8px;
            background-repeat: repeat-x;
            background-position: center;
        }
        .score-board::before {
            top: 4px;
        }
        .score-board::after {
            bottom: 4px;
        }

        .quiz-container {
            width: 95%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-grow: 1;
            justify-content: center;
        }

        .question-panel {
            width: 100%;
            min-height: 130px;
            background: var(--panel-bg);
            border: 2px solid var(--border-glow);
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3), inset 0 0 15px rgba(0, 210, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 20px 30px;
            text-align: left;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: center;
        }

        .options-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
        }

        .option-btn {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-glow);
            border-radius: 18px;
            padding: 15px 20px;
            color: var(--text-color);
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        .option-label {
            font-weight: bold;
            color: var(--border-glow);
            margin-right: 12px;
            min-width: 20px;
        }

        .option-content {
            flex-grow: 1;
            line-height: 1.35;
        }

        .option-btn.correct {
            background: rgba(0, 255, 102, 0.2);
            border-color: var(--correct-color);
            box-shadow: 0 0 20px var(--correct-color);
        }
        .option-btn.correct .option-label, .option-btn.correct .option-content {
            color: var(--correct-color);
        }

        .option-btn.wrong {
            background: rgba(255, 51, 51, 0.2);
            border-color: var(--wrong-color);
            box-shadow: 0 0 20px var(--wrong-color);
        }
        .option-btn.wrong .option-label, .option-btn.wrong .option-content {
            color: var(--wrong-color);
        }

        .explanation-box {
            display: none;
            width: 100%;
            margin-top: 18px;
            padding: 14px 18px;
            background: rgba(255, 51, 51, 0.12);
            border: 1.5px solid rgba(255, 80, 80, 0.5);
            border-radius: 14px;
            color: #ffb4b4;
            font-size: 0.95rem;
            line-height: 1.45;
            box-sizing: border-box;
            text-align: left;
        }

        .explanation-box.visible {
            display: block;
        }

        .footer-controls {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .action-btn {
            background: linear-gradient(135deg, #0072ff, #00d2ff);
            border: none;
            border-radius: 12px;
            padding: 10px 22px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transition: 0.3s;
        }

        .action-btn:hover {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
            transform: scale(1.05);
        }

        #nextBtn {
            display: none;
        }

        .navigation-dock {
            margin-top: 25px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            gap: 15px;
            align-items: stretch;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
            box-sizing: border-box;
        }

        .categories-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 15px;
        }

        .nav-page-btn {
            background: var(--panel-bg);
            border: 1.5px solid #10b981;
            border-radius: 18px;
            padding: 6px 10px;
            color: #10b981;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            position: relative;
        }

        .nav-page-btn:hover, .nav-page-btn.active {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.7);
            transform: translateY(-2px);
        }

        .nav-page-btn::after {
            content: attr(data-title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: rgba(5, 15, 45, 0.95);
            color: #00d2ff;
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
        }

        .nav-page-btn[data-title]:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        .nav-btn-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .random-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #f59e0b;
            border-radius: 18px;
            padding: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 180px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .random-btn:hover, .random-btn.active {
            background: rgba(245, 158, 11, 0.15);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
            border-color: #fbbf24;
            transform: translateY(-2px);
        }

        .random-btn-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .completion-screen {
            display: none;
            text-align: center;
            background: var(--panel-bg);
            border: 2px solid var(--border-glow);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            width: 100%;
        }

        .completion-screen h2 {
            font-size: 2rem;
            color: var(--border-glow);
            margin-bottom: 20px;
        }

        /* ========== Mobile optimizations (iPhone 12 Pro ≈ 390×844) ========== */
        @media (max-width: 480px) {
            body {
                padding: 10px 8px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                min-height: 100dvh;
                justify-content: flex-start;
            }

            .header-container {
                margin-bottom: 6px;
            }

            .page-header {
                font-size: 1.05rem;
                line-height: 1.25;
                letter-spacing: 0.2px;
                padding: 0 4px;
            }

            .question-counter {
                font-size: 0.85rem;
            }

            .quiz-container {
                width: 100%;
                max-width: 100%;
                flex-grow: 0;
                justify-content: flex-start;
            }

            .question-panel {
                min-height: auto;
                padding: 14px 14px;
                margin-bottom: 14px;
                border-radius: 18px;
            }

            .question-text {
                font-size: 0.98rem;
                line-height: 1.35;
            }

            #imageContainer {
                margin-top: 10px;
            }

            #questionImage {
                max-height: 180px;
                object-fit: contain;
            }

            /* Stack answer options in a single column for easier tapping */
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .option-btn {
                padding: 14px 14px;
                font-size: 0.88rem;
                border-radius: 14px;
                min-height: 52px; /* comfortable touch target */
                align-items: center;
            }

            .option-label {
                margin-right: 10px;
                min-width: 18px;
                font-size: 0.95rem;
            }

            .option-content {
                line-height: 1.3;
            }

            .explanation-box {
                margin-top: 12px;
                padding: 12px 12px;
                font-size: 0.88rem;
                border-radius: 12px;
            }

            /* Score board – shrink so it never overflows */
            .score-board {
                font-size: 0.82rem;
                letter-spacing: 0.4px;
                padding: 10px 14px;
                margin-top: 14px;
                border-width: 3px;
                border-radius: 28px;
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .score-board::before,
            .score-board::after {
                left: 10px;
                right: 10px;
                height: 6px;
                background-size: 12px 6px;
            }
            .score-board::before { top: 3px; }
            .score-board::after { bottom: 3px; }

            .footer-controls {
                margin-top: 12px;
                justify-content: center;
            }

            .action-btn {
                padding: 12px 28px;
                font-size: 0.95rem;
                border-radius: 14px;
                min-height: 48px;
                width: 100%;
                max-width: 280px;
            }

            /* Navigation dock – horizontal scrollable category row */
            .navigation-dock {
                margin-top: 16px;
                padding-top: 12px;
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .categories-grid {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                gap: 10px;
                padding-bottom: 6px;
                scrollbar-width: none; /* Firefox */
            }
            .categories-grid::-webkit-scrollbar {
                display: none;
            }

            .nav-page-btn {
                flex: 0 0 auto;
                width: 64px;
                min-width: 64px;
                height: 64px;
                min-height: 64px;
                padding: 4px;
                border-radius: 14px;
            }

            .nav-btn-icon {
                border-radius: 10px;
            }

            /* Hide long tooltips on touch devices – they conflict with taps */
            .nav-page-btn::after {
                display: none;
            }

            .random-btn {
                width: 100%;
                height: 56px;
                min-height: 56px;
                padding: 4px 8px;
                border-radius: 14px;
            }

            .random-btn-icon {
                max-height: 48px;
                width: auto;
                object-fit: contain;
            }

            .completion-screen {
                padding: 28px 18px;
                border-radius: 20px;
            }

            .completion-screen h2 {
                font-size: 1.4rem;
                margin-bottom: 14px;
            }

            #finalScoreText {
                font-size: 1rem !important;
                line-height: 1.4;
            }
        }

        /* Extra-narrow / landscape phones */
        @media (max-width: 360px) {
            .page-header { font-size: 0.95rem; }
            .question-text { font-size: 0.92rem; }
            .score-board { font-size: 0.75rem; padding: 8px 10px; }
            .nav-page-btn { width: 56px; min-width: 56px; height: 56px; min-height: 56px; }
        }

        /* Prefer taller touch targets when the user has coarse pointer (touch) */
        @media (pointer: coarse) {
            .option-btn {
                min-height: 52px;
            }
            .action-btn {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <div class="header-container">
            <div class="page-header" id="pageTitle">Φόρτωση...</div>
            <div class="counters-wrapper">
                <div class="question-counter" id="questionCounter">Ερώτηση: 0 / 0</div>
            </div>
        </div>

        <div class="question-panel">
            <div class="question-text" id="questionText">Φόρτωση ερωτήσεων...</div>
            <div id="imageContainer" style="margin-top: 15px; text-align: center; display: none;">
                <img id="questionImage" src="" alt="Question Graph" style="max-width: 100%; height: auto; border-radius: 8px;" />
            </div>
        </div>

        <div class="options-grid" id="optionsGrid">
            <button class="option-btn" onclick="checkAnswer('α', event)">
                <span class="option-label">Α:</span>
                <span class="option-content" id="opt-alpha">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('β', event)">
                <span class="option-label">Β:</span>
                <span class="option-content" id="opt-beta">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('γ', event)">
                <span class="option-label">Γ:</span>
                <span class="option-content" id="opt-gamma">...</span>
            </button>
            <button class="option-btn" onclick="checkAnswer('δ', event)">
                <span class="option-label">Δ:</span>
                <span class="option-content" id="opt-delta">...</span>
            </button>
        </div>

        <div class="explanation-box" id="explanationBox"></div>

        <div class="score-board" id="scoreBoard">Επιτυχία: 0% | Σωστές ✅ 0 / Λάθος ❌ 0</div>

        <div class="footer-controls">
            <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Επόμενη</button>
        </div>
    </div>

    <div class="quiz-container">
        <div class="completion-screen" id="completionScreen">
            <h2 id="completionTitle">Το Κουίζ Ολοκληρώθηκε!</h2>
            <p id="finalScoreText" style="font-size: 1.2rem; margin-bottom: 25px;"></p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="action-btn" onclick="restartQuiz()">Επανεκκίνηση</button>
            </div>
        </div>
    </div>

    <div class="navigation-dock">
        <div class="categories-grid" id="categoriesGrid"></div>
        <button class="random-btn" id="randomQuizBtn" data-module="randomQuiz" onclick="loadModule('randomQuiz')">
            <img src="Artwork/random_quiz.jpeg" alt="Random Quiz" class="random-btn-icon" />
        </button>
    </div>

    <!-- External Question Files -->
    <script src="1_paragoga_xrimatopistotika_mesa.js"></script>
    <script src="2_agora_paragogon.js"></script>
    <script src="3_arbitrage.js"></script>
    <script src="4_prothesmiaka_symvolaia_kai_sme.js"></script>
    <script src="5_dikaiomata_proairesis.js"></script>
    <script src="6_swaps.js"></script>
    <script src="7_anoiktes_poliseis.js"></script>
    <script src="8_warrants.js"></script>

    <script>
        window.module1Data = window.module1Data || { title: "Παράγωγα Χρηματοπιστωτικά Μέσα", data: [] };
        window.module2Data = window.module2Data || { title: "Αγορά Παραγώγων", data: [] };
        window.module3Data = window.module3Data || { title: "Arbitrage", data: [] };
        window.module4Data = window.module4Data || { title: "Προθεσμιακά Συμβόλαια & ΣΜΕ", data: [] };
        window.module5Data = window.module5Data || { title: "Δικαιώματα Προαίρεσης", data: [] };
        window.module6Data = window.module6Data || { title: "Swaps", data: [] };
        window.module7Data = window.module7Data || { title: "Ανοιχτές Πωλήσεις", data: [] };
        window.module8Data = window.module8Data || { title: "Warrants", data: [] };

        const modules = {
            derivatives: module1Data,
            market: module2Data,
            arbitrage: module3Data,
            futures: module4Data,
            options: module5Data,
            swaps: module6Data,
            shortselling: module7Data,
            warrants: module8Data
        };

        function generateRandomQuizPool() {
            let combinedQuestions = [];
            Object.keys(modules).forEach(key => {
                const mod = modules[key];
                if (mod && mod.data && mod.data.length > 0) {
                    let targetCount = Math.round(mod.data.length * 0.0625);
                    if (targetCount < 1) targetCount = 1;
                    
                    let shuffled = [...mod.data].sort(() => 0.5 - Math.random());
                    let selected = shuffled.slice(0, targetCount);
                    combinedQuestions = combinedQuestions.concat(selected);
                }
            });
            return combinedQuestions.sort(() => 0.5 - Math.random());
        }

        const randomQuizData = {
            title: "Random Quiz",
            data: generateRandomQuizPool()
        };

        const categoryModules = {
            derivatives: { ...module1Data, icon: "Artwork/1_paragoga_xrimatopistotika_mesa.png" },
            market: { ...module2Data, icon: "Artwork/2_agora_paragogon.avif" },
            arbitrage: { ...module3Data, icon: "Artwork/3_arbitrage.avif" },
            futures: { ...module4Data, icon: "Artwork/4_prothesmiaka_symvolaia_kai_sme.png" },
            options: { ...module5Data, icon: "Artwork/5_dikaiomata_proairesis.jpeg" },
            swaps: { ...module6Data, icon: "Artwork/6_swaps.png" },
            shortselling: { ...module7Data, icon: "Artwork/7_anoiktes_poliseis.jpeg" },
            warrants: { ...module8Data, icon: "Artwork/8_warrants.jpg" }
        };

        const allQuizCategories = {
            ...categoryModules,
            randomQuiz: randomQuizData
        };

        const moduleStates = {
            randomQuiz: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            derivatives: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            market: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            arbitrage: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            futures: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            options: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            swaps: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            shortselling: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false },
            warrants: { currentIndex: 0, totalCorrect: 0, totalAnswered: 0, answered: false, selectedAnswer: null, isCompleted: false }
        };

        let currentModuleKey = 'randomQuiz';

        function loadModule(moduleKey) {
            currentModuleKey = moduleKey;
            updateNavActiveState();

            const state = moduleStates[currentModuleKey];
            if (state.isCompleted) {
                showCompletionScreen();
            } else {
                document.getElementById('completionScreen').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'flex';
                displayQuestion();
            }
        }

        function updateNavActiveState() {
            const buttons = document.querySelectorAll('.nav-page-btn, .random-btn');
            buttons.forEach(btn => {
                if(btn.getAttribute('data-module') === currentModuleKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Converts answers like:
        // "Ι + ΙΙ + ΙΙΙ + IV."  →  "I, II, III και IV"
        // "Ι, ΙΙ, ΙΙΙ, ΙV & V"  →  "Ι, ΙΙ, ΙΙΙ, ΙV και V"
        function normalizeRomanAnswer(text) {
            if (!text) return text;
            const trimmed = text.trim().replace(/\.$/, '');

            // Detect if the text (or its ending) looks like a Roman-numeral list
            const romanListRegex = /^([ΙIVivΧX]+(?:\s*[,+&]\s*[ΙIVivΧX]+)+(?:\s*(?:και|&)\s*[ΙIVivΧX]+)?)$/i;
            const endsWithList = /([ΙIVivΧX]+(?:\s*[,+&]\s*[ΙIVivΧX]+)+(?:\s*(?:και|&)\s*[ΙIVivΧX]+)?)$/i;

            let listPart = null;
            let prefix = '';

            if (romanListRegex.test(trimmed)) {
                listPart = trimmed;
            } else {
                const m = trimmed.match(endsWithList);
                if (m) {
                    listPart = m[1];
                    prefix = trimmed.slice(0, m.index).trim();
                }
            }

            if (!listPart) return text;

            return (prefix ? prefix + ' ' : '') + formatRomanList(listPart);
        }

        function formatRomanList(str) {
            // Normalize separators: turn & and "και" into commas, then split
            let parts = str
                .replace(/\s*&\s*/g, ',')
                .replace(/\s*και\s*/gi, ',')
                .replace(/\s*\+\s*/g, ',')
                .split(',')
                .map(p => p.trim())
                .filter(Boolean);

            // Keep original Greek/Latin form (just clean up)
            if (parts.length === 0) return str;
            if (parts.length === 1) return parts[0];
            if (parts.length === 2) return `${parts[0]} και ${parts[1]}`;
            return parts.slice(0, -1).join(', ') + ' και ' + parts[parts.length - 1];
        }

        function displayQuestion() {
            const currentModule = allQuizCategories[currentModuleKey];
            const state = moduleStates[currentModuleKey];
            
            if (!currentModule || !currentModule.data || currentModule.data.length === 0) {
                document.getElementById('pageTitle').innerText = currentModule ? currentModule.title : "Σφάλμα";
                document.getElementById('questionCounter').innerText = "Ερώτηση: 0 / 0";
                document.getElementById('questionText').innerText = "Δεν βρέθηκαν ερωτήσεις σε αυτό το αρχείο ή τα αρχεία JS δεν φορτώθηκαν σωστά.";
                document.getElementById('imageContainer').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }

            const qData = currentModule.data[state.currentIndex];

            document.getElementById('pageTitle').innerText = currentModule.title;
            document.getElementById('questionCounter').innerText = `Ερώτηση: ${state.currentIndex + 1} / ${currentModule.data.length}`;
            document.getElementById('questionText').innerText = qData.question.replace(/^\d+[\.\)]\s*/, '');

            const imageContainer = document.getElementById('imageContainer');
            const questionImage = document.getElementById('questionImage');
            if (qData.image) {
                questionImage.src = qData.image;
                imageContainer.style.display = 'block';
            } else {
                questionImage.src = '';
                imageContainer.style.display = 'none';
            }

            const optionMap = {
                'α': document.getElementById('opt-alpha'),
                'β': document.getElementById('opt-beta'),
                'γ': document.getElementById('opt-gamma'),
                'δ': document.getElementById('opt-delta')
            };
            const optionButtons = document.querySelectorAll('.option-btn');

            optionButtons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
                btn.style.display = '';
            });

            ['α', 'β', 'γ', 'δ'].forEach(key => {
                const text = (qData.options[key] || '').trim();
                const el = optionMap[key];
                const btn = el.closest('.option-btn');
                if (text === 'Null.' || text === 'Null' || text === '') {
                    btn.style.display = 'none';
                } else {
                    el.innerText = normalizeRomanAnswer(text);
                    btn.style.display = '';
                }
            });

            const explanationBox = document.getElementById('explanationBox');
            explanationBox.classList.remove('visible');
            explanationBox.innerHTML = '';

            if (state.answered) {
                optionButtons.forEach(btn => btn.disabled = true);
                const correctOption = qData.correct;
                
                optionButtons.forEach(btn => {
                    const onclickAttr = btn.getAttribute('onclick');
                    if (onclickAttr && onclickAttr.includes(`'${correctOption}'`)) {
                        btn.classList.add('correct');
                    }
                });

                if (state.selectedAnswer && state.selectedAnswer !== correctOption) {
                    optionButtons.forEach(btn => {
                        const onclickAttr = btn.getAttribute('onclick');
                        if (onclickAttr && onclickAttr.includes(`'${state.selectedAnswer}'`)) {
                            btn.classList.add('wrong');
                        }
                    });
                    if (qData.explanation) {
                        explanationBox.innerHTML = qData.explanation;
                        explanationBox.classList.add('visible');
                    }
                }
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                document.getElementById('nextBtn').style.display = 'none';
            }

            updateScoreBoard();
        }

        function checkAnswer(selectedOption, event) {
            const state = moduleStates[currentModuleKey];
            if (state.answered) return;
            state.answered = true;
            state.selectedAnswer = selectedOption;

            state.totalAnswered++;

            const currentModule = allQuizCategories[currentModuleKey];
            if (!currentModule || !currentModule.data || currentModule.data.length === 0) return;

            const qData = currentModule.data[state.currentIndex];
            const correctOption = qData.correct;

            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => btn.disabled = true);

            const explanationBox = document.getElementById('explanationBox');
            explanationBox.classList.remove('visible');
            explanationBox.innerHTML = '';

            if (selectedOption === correctOption) {
                state.totalCorrect++;
                event.currentTarget.classList.add('correct');
            } else {
                event.currentTarget.classList.add('wrong');
                optionButtons.forEach(btn => {
                    const onclickAttr = btn.getAttribute('onclick');
                    if (onclickAttr && onclickAttr.includes(`'${correctOption}'`)) {
                        btn.classList.add('correct');
                    }
                });
                if (qData.explanation) {
                    explanationBox.innerHTML = qData.explanation;
                    explanationBox.classList.add('visible');
                }
            }

            document.getElementById('nextBtn').style.display = 'block';
            updateScoreBoard();
        }

        function updateScoreBoard() {
            const state = moduleStates[currentModuleKey];
            let percentage = 0;
            if (state.totalAnswered > 0) {
                percentage = Math.round((state.totalCorrect / state.totalAnswered) * 100);
            }
            const totalIncorrect = state.totalAnswered - state.totalCorrect;
            document.getElementById('scoreBoard').innerText = `Επιτυχία: ${percentage}% | Σωστές ✅ ${state.totalCorrect} / Λάθος ❌ ${totalIncorrect}`;
        }

        function nextQuestion() {
            const currentModule = allQuizCategories[currentModuleKey];
            const state = moduleStates[currentModuleKey];
            
            state.currentIndex++;
            state.answered = false;
            state.selectedAnswer = null;

            if (currentModule && state.currentIndex < currentModule.data.length) {
                displayQuestion();
            } else {
                state.isCompleted = true;
                showCompletionScreen();
            }
        }

        function showCompletionScreen() {
            document.getElementById('quizContainer').style.display = 'none';
            const completionScreen = document.getElementById('completionScreen');
            completionScreen.style.display = 'block';
            
            const state = moduleStates[currentModuleKey];
            let percentage = 0;
            if (state.totalAnswered > 0) {
                percentage = Math.round((state.totalCorrect / state.totalAnswered) * 100);
            }
            const totalIncorrect = state.totalAnswered - state.totalCorrect;
            document.getElementById('finalScoreText').innerText = `Ολοκληρώθηκε! Συνολικό Ποσοστό Επιτυχίας: ${percentage}% | ${state.totalCorrect} ✅ / ${totalIncorrect} ❌ (από ${state.totalAnswered} απαντημένες).`;
        }

        function restartQuiz() {
            const state = moduleStates[currentModuleKey];
            state.currentIndex = 0;
            state.totalCorrect = 0;
            state.totalAnswered = 0;
            state.answered = false;
            state.selectedAnswer = null;
            state.isCompleted = false;

            if (currentModuleKey === 'randomQuiz') {
                randomQuizData.data = generateRandomQuizPool();
            }

            loadModule(currentModuleKey);
        }

        function initNavDock() {
            const categoriesGrid = document.getElementById('categoriesGrid');
            categoriesGrid.innerHTML = '';
            
            Object.keys(categoryModules).forEach(key => {
                const mod = categoryModules[key];
                const btn = document.createElement('button');
                btn.className = 'nav-page-btn';
                btn.setAttribute('data-module', key);
                btn.setAttribute('data-title', mod.title);
                
                if (mod.icon) {
                    const img = document.createElement('img');
                    img.src = mod.icon;
                    img.alt = mod.title;
                    img.className = 'nav-btn-icon';
                    btn.appendChild(img);
                } else {
                    btn.innerText = mod.title;
                }
                
                btn.onclick = () => loadModule(key);
                categoriesGrid.appendChild(btn);
            });
        }

        window.onload = function() {
            initNavDock();
            loadModule('randomQuiz');
        };
    </script>
</body>
</html>
